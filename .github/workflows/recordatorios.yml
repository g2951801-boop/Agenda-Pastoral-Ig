name: Recordatorios diarios

on:
  schedule:
    - cron: "5 6,7,11,12,19,20 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Enviar ahora como prueba"
        required: false
        default: auto
        type: choice
        options: [auto, morning, midday, night]

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node enviar-recordatorios.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FORCE_SLOT: ${{ github.event.inputs.slot }}
